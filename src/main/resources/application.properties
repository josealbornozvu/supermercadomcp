spring.application.name=supermercadomcp

# --- Servidor MCP (Streamable HTTP) ---
spring.ai.mcp.server.name=supermercadomcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
server.port=8089

# --- MySQL (la clave se lee de la variable de entorno PWD_UDEA) ---
spring.datasource.url=jdbc:mysql://localhost:3306/supermercadomcp?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${PWD_UDEA}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

logging.file.name=./logs/supermercadomcp.log
logging.level.root=INFO
logging.level.org.springframework.ai=DEBUG